<svg xmlns="http://www.w3.org/2000/svg" width="960" height="912" viewBox="0 0 960 912" role="img" aria-labelledby="scope-title scope-desc">
<title id="scope-title">What a role covers</title>
<desc id="scope-desc">The Straza role ghapp-write-payments holds pr_create, pr_merge and git_push. Its field covers takes one of three forms. every covers all nine repos. objects: [Strazahq/pay-api] covers one. where: {team: [payments]} covers the three repos whose team is payments: pay-api, pay-ledger and refunds. The team comes from a GitHub custom property, which ghapp's repo_list hands to Straza. midPoint imports the role as AR:ghapp-write-payments with the covers line repo where team is payments, the rule in words.</desc>
