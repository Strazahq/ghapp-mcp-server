<svg xmlns="http://www.w3.org/2000/svg" width="960" height="752" viewBox="0 0 960 752" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Who holds what</title>
<desc id="overview-desc">Four parts, left to right: the agent machine, Straza, ghapp and GitHub. The agent machine holds the agent, git through Straza's holder and its Straza session, and never a GitHub token. Straza holds roles, approvals and audit. ghapp holds the App private key and the GitHub tokens, which stay in ghapp, and checks the exact name and the repo id. GitHub holds the repos and its audit log, which shows ghapp[bot] and the token hash. One call goes from the agent through Straza and ghapp to GitHub and back.</desc>
