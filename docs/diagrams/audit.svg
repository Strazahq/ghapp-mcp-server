<svg xmlns="http://www.w3.org/2000/svg" width="960" height="904" viewBox="0 0 960 904" role="img" aria-labelledby="audit-title audit-desc">
<title id="audit-title">Following one push</title>
<desc id="audit-desc">Three log lines for one push. Straza's audit: agent joe-macos-agent, tool git_push, repo Strazahq/pay-api, allowed. ghapp's log: agent joe-macos-agent, ref refs/heads/fix-login, repo Strazahq/pay-api, token hash. GitHub's audit log: actor ghapp[bot], action git.push, repo Strazahq/pay-api, hashed_token. The hash in GitHub's line matches the hash in ghapp's line, and that line names the agent, which matches Straza's line.</desc>
<style>svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;--bg:#F5F6F8;--card:#FFFFFF;--line:#D7DBE1;--faint:#C4CAD2;--ink:#1A1D23;--ink2:#596170;--agent:#2C5F9E;--straza:#17765A;--ghapp:#8C5B09;--github:#59616E;--no:#B1271B;--agent-t:#E2EBF7;--straza-t:#DCF0E8;--ghapp-t:#F6EAD3;--github-t:#E8EBEF;--no-t:#FBE3E0;}@media (prefers-color-scheme:dark){svg{--bg:#14171C;--card:#1B1F26;--line:#2E343D;--faint:#3B424D;--ink:#E6E8EC;--ink2:#A1A9B5;--agent:#83AEE8;--straza:#5DC3A0;--ghapp:#E2AC52;--github:#AEB6C2;--no:#F08A7E;--agent-t:#1C2B40;--straza-t:#13322A;--ghapp-t:#36290F;--github-t:#272C34;--no-t:#3D1D1A;}}text{white-space:pre}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","Noto Sans Mono",monospace}.panel{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.card{fill:var(--card);stroke:var(--line);stroke-width:1.25}.z16{font-size:16px}.z17{font-size:17px}.z18{font-size:18px}.z19{font-size:19px}.z20{font-size:20px}.z21{font-size:21px}.z22{font-size:22px}.z28{font-size:28px}.w6{font-weight:600}.it{font-style:italic}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.oncard{fill:var(--card)}.h{paint-order:stroke;stroke:var(--bg);stroke-width:8px;stroke-linejoin:round}.hc{paint-order:stroke;stroke:var(--card);stroke-width:8px;stroke-linejoin:round}.trk{fill:none;stroke:var(--faint);stroke-width:2}.trk10{fill:none;stroke:var(--faint);stroke-width:10;stroke-linecap:round}.life{fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-dasharray:0 7}.ln{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}.ln10{fill:none;stroke-width:10;stroke-linecap:round}.dash{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 5}.frame{fill:none;stroke:var(--line);stroke-width:1.25}.pk,.o0{opacity:0}.mask{fill:var(--card)}.pkf{fill:var(--ink)}.f-agent{fill:var(--agent)}.s-agent{stroke:var(--agent)}.t-agent{fill:var(--agent-t)}.f-straza{fill:var(--straza)}.s-st