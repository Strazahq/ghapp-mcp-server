<rect x="0.75" y="0.75" width="958.5" height="902.5" rx="20" class="panel"/>
<text x="32" y="62" class="m z18 ink2">05</text>
<text x="66" y="62" class="z28 w6 ink">Following one push</text>
<text x="32" y="104" class="z20 ink">GitHub shows <tspan class="m">ghapp[bot]</tspan> for every agent. The token hash leads back to one.</text>
<g class="k1"><rect x="32" y="132" width="896" height="150" rx="14" class="card"/><path d="M46 132 A14 14 0 0 0 32 146 V268 A14 14 0 0 0 46 282" class="s-straza" fill="none" stroke-width="5"/><text x="60" y="174" class="z20 w6 ink">Straza audit</text><text x="900" y="174" class="m z18 ink2" text-anchor="end">10:42:07</text><text x="60" y="220" class="z17 ink2">agent</text><text x="170" y="220" class="m z20 ink">joe-macos-agent</text><text x="500" y="220" class="z17 ink2">tool</text><text x="640" y="220" class="m z20 ink">git_push</text><text x="60" y="258" class="z17 ink2">repo</text><text x="170" y="258" class="m z20 ink">Strazahq/pay-api</text><text x="500" y="258" class="z17 ink2">decision</text><text x="640" y="258" class="m z20 ink">allowed</text></g>
<g class="k2"><rect x="32" y="342" width="896" height="150" rx="14" class="card"/><path d="M46 342 A14 14 0 0 0 32 356 V478 A14 14 0 0 0 46 492" class="s-ghapp" fill="none" stroke-width="5"/><text x="60" y="384" class="z20 w6 ink">ghapp log</text><text x="900" y="384" class="m z18 ink2" text-anchor="end">10:42:09</text><text x="60" y="430" class="z17 ink2">agent</text><text x="170" y="430" class="m z20 ink">joe-macos-agent</text><text x="500" y="430" class="z17 ink2">ref</text><text x="640" y="430" class="m z20 ink">refs/heads/fix-login</text><text x="60" y="468" class="z17 ink2">repo</text><text x="170" y="468" class="m z20 ink">Strazahq/pay-api</text><text x="500" y="468" class="z17 ink2">token hash</text><text x="640" y="468" class="m z20 ink">Xk2d…Qp8=</text></g>
<g class="k3"><rect x="32" y="552" width="896" height="150" rx="14" class="card"/><path d="M46 552 A14 14 0 0 0 32 566 V688 A14 14 0 0 0 46 702" class="s-github" fill="none" stroke-width="5"/><text x="60" y="594" class="z20 w6 ink">GitHub audit log</text><text x="900" y="594" class="m z18 ink2" text-anchor="end">10:42:10</text><text x="60" y="640" class="m z17 ink2">actor</text><text x="170" y="640" class="m z20 ink">ghapp[bot]</text><text x="500" y="640" class="m z17 ink2">action</text><text x="640" y="640" class="m z20 ink">git.push</text><text x="60" y="678" class="m z17 ink2">repo</text><text x="170" y="678" class="m z20 ink">Strazahq/pay-api</text><text x="500" y="678" class="m z17 ink2">hashed_token</text><text x="640" y="678" class="m z20 ink">Xk2d…Qp8=</text></g>
<text x="306" y="640" class="z17 it ink2">for every agent</text>
<path d="M694 550 L694 495" class="ln s-ghapp k4"/>
<path d="M687 502 L694 495 L701 502" class="ln s-ghapp k5"/>
<text x="710" y="528" class="z17 ink2 k6">same hash</text>
<path d="M260 340 L260 285" class="ln s-agent k7"/>
<path d="M253 292 L260 285 L267 292" class="ln s-agent k8"/>
<text x="276" y="318" class="z17 ink2 k9">same agent</text>
<g class="k10"><rect x="634" y="656" width="120" height="31" rx="6" stroke-width="1.5" class="t-ghapp s-ghapp"/><text x="640" y="678" class="m z20 ink">Xk2d…Qp8=</text></g>
<g class="k11"><rect x="634" y="446" width="120" height="31" rx="6" stroke-width="1.5" class="t-ghapp s-ghapp"/><text x="640" y="468" class="m z20 ink">Xk2d…Qp8=</text></g>
<g class="k12"><rect x="164" y="408" width="192" height="31" rx="6" stroke-width="1.5" class="t-agent s-agent"/><text x="170" y="430" class="m z20 ink">joe-macos-agent</text></g>
<g class="k13"><rect x="164" y="198" width="192" height="31" rx="6" stroke-width="1.5" class="t-agent s-agent"/><text x="170" y="220" class="m z20 ink">joe-macos-agent</text></g>
<g class="k14"><rect x="634" y="236" width="96" height="31" rx="6" stroke-width="1.5" class="t-straza s-straza"/><text x="640" y="258" class="m z20 ink">allowed</text></g>
<text x="32" y="750" class="z19 ink">Read it from the bottom. GitHub's event names only <tspan class="m">ghapp[bot]</tspan>.</text>
<text x="32" y="777" class="z19 ink">Its <tspan class="m">hashed_token</tspan> finds one line in ghapp's log, and that line names the agent.</text>
<rect x="32" y="812" width="12" height="12" rx="2" class="mk-full"/>
<text x="54" y="824" class="z17 ink2"><tspan class="w6 ink">Built: </tspan>ghapp's log: each token made, with its hash, and each git operation.</text>
<rect x="32" y="839" width="12" height="12" rx="2" class="mk-full"/>
<text x="54" y="851" class="z17 ink2"><tspan class="w6 ink">Built: </tspan>the repo in Straza's line, through the role field covers.</text>
</svg>
