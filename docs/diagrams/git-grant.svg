<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1140" viewBox="0 0 960 1140" role="img" aria-labelledby="git-grant-title git-grant-desc">
<title id="git-grant-title">git push through Straza's holder</title>
<desc id="git-grant-desc">1: the agent types plain git push origin fix-login, and one git setting sends it to Straza's holder, a service on the same machine under its own OS account. 2: the holder reads the update before any code moves: refs/heads/fix-login from a1b2c3d to e4f5a6b. 3: the holder asks Straza for a grant; Straza checks that a role holds git_push and covers the repo, and a person may approve, seeing the branch and the commits. Straza returns a grant: signed, 5 minutes, this branch and these commits, bound to the holder's key. 4: the holder sends the push to ghapp with the grant and a proof signed by its key, not through Straza; ghapp checks Straza's signature, the proof, and that the push is exactly what was granted, then makes a token for one repo with contents write, which stays in ghapp. 5: GitHub takes the pack and answers per ref, and git prints it. The agent can read nothing that opens ghapp or GitHub: a copied grant is useless without the holder's key.</desc>
