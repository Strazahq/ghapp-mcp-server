<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1038" viewBox="0 0 960 1038" role="img" aria-labelledby="tool-call-title tool-call-desc">
<title id="tool-call-title">One tool call</title>
<desc id="tool-call-desc">joe-macos-agent calls pr_create on Strazahq/pay-api. Step 1, Straza: a role covers the repo. Step 2, ghapp: who is calling, a Keycloak token from a listed client. Step 3, ghapp: the name is exact and the id matches. Step 4, ghapp: a token for repo 812345678 with pull_requests write and contents read. Step 5, GitHub: the pull request is created, as ghapp[bot]. The result comes back the same way. Then the same agent calls pr_create on Strazahq/straza, and Straza refuses: none of your roles on ghapp covers that repo. ghapp and GitHub never see that call.</desc>
